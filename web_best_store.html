<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 Yahoo 베스트 스토어 - BidBuy Korea</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  :root{--font-sans:'Pretendard','Malgun Gothic','돋움','Dotum','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',Arial,sans-serif;--tp:#1A1A2E;--ts:#666680;--rose-h:#C42F4C;--border:#E0E4EB;--bg:#F5F7FA}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--tp);font-size:14px;line-height:1.5}
  a{text-decoration:none;color:inherit}
  .bs-wrap{max-width:960px;margin:0 auto;padding:48px 20px 72px;background:#fff;min-height:70vh}
  .bs-title{margin:0 0 20px;font-size:32px;font-weight:700}
  .bs-sec{margin-bottom:32px}
  .bs-row{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--border)}
  .bs-rank{width:36px;flex:none;text-align:center;font-size:22px;font-weight:700;color:var(--tp)}
  .bs-rank-1{color:var(--rose-h)}
  .bs-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .bs-tag{font-size:13px;font-weight:500;color:var(--ts)}
  .bs-name{font-size:17px;font-weight:700}
  .bs-desc{font-size:14px;color:var(--ts)}
  .bs-cat{margin-top:16px;scroll-margin-top:90px}
  .bs-h3{margin:0;padding-top:4px;font-size:15px;font-weight:700;color:var(--ts)}
  .bs-nav{margin:0 0 32px}
  .bs-tabs{display:flex;border-bottom:1px solid var(--border)}
  .bs-tab{flex:1;min-height:48px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--ts);cursor:pointer}
  .bs-tab.active{color:var(--tp);font-weight:700;border-bottom-color:var(--tp)}
  .bs-subnav{display:flex;flex-wrap:wrap;gap:8px;padding:16px;background:var(--bg);border-radius:0 0 8px 8px}
  .bs-subnav[hidden]{display:none}
  .bs-nav-link{min-height:40px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:5px;background:#fff;font-size:14px;color:var(--tp)}
  .bs-nav-link:hover{border-color:var(--tp)}
  .bs-cat-desc{margin:2px 0 4px;font-size:13px;color:var(--ts)}
  [hidden]{display:none!important}
  .bs-main-tabs{display:flex;margin:0 0 8px;border-bottom:1px solid var(--border)}
  .bs-main-tab{flex:1;min-height:56px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:17px;font-weight:500;color:var(--ts);cursor:pointer}
  .bs-main-tab.active{color:var(--tp);font-weight:700;border-bottom-color:var(--tp)}
  .bs-intro{margin:0 0 8px;padding:16px 20px;background:var(--bg);border-radius:8px;font-size:14px;line-height:1.6;color:var(--ts)}
  .bs-top .bs-row{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 0}
  .bs-top .bs-rank{width:auto;font-size:28px}
  .bs-top .bs-info{flex:none;align-items:center}
  .bs-top .bs-name{font-size:32px;line-height:1.3}
  .bs-cards{margin-top:8px}
  .bs-cards .bs-row,.bs-sp .bs-row{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 0}
  .bs-cards .bs-rank{width:auto;font-size:22px}
  .bs-cards .bs-info,.bs-sp .bs-info{flex:none;align-items:center}
  .bs-sp .bs-cat{margin:0 0 24px}
  .bs-cat .bs-h3{padding-top:0;text-align:center;font-size:28px;line-height:1.3;color:var(--tp)}
  .bs-cat-desc{text-align:center}
  .bs-cards .bs-name{font-size:32px;line-height:1.3}
  .bs-sp .bs-cat-desc{text-align:center}
  .bs-sp .bs-name{font-size:32px;line-height:1.3}
  .bs-prods{width:100%;margin-top:16px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;min-height:250px}
  .bs-prod{display:flex;flex-direction:column;gap:3px;padding:8px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--tp);min-width:0;text-align:left}
  .bs-prod-img{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
  .bs-prod-img img{width:100%;height:100%;object-fit:cover;display:block}
  .bs-prod-title{margin-top:4px;min-height:36px;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bs-prod-price{font-size:14px;color:var(--tp)}
  .bs-prod-cur{font-size:13px;color:var(--ts)}
  .bs-prod-buy{font-size:13px;color:var(--ts)}
  .bs-prod-meta{font-size:13px;font-weight:700;color:var(--tp)}
  .bs-prod:hover{border-color:var(--tp)}
  @media (max-width:900px){.bs-prods{grid-template-columns:repeat(3,minmax(0,1fr))}}
  a.bs-name{display:inline-flex;align-items:center;gap:6px;color:var(--tp);text-decoration:none}
  a.bs-name:hover{text-decoration:underline}
  .bs-name svg{flex:none;width:.6em;height:.6em}
  .bs-more{display:none;width:100%;min-height:44px;margin-top:12px;border:1px solid var(--border);border-radius:22px;background:#fff;font:inherit;font-size:14px;color:var(--tp);cursor:pointer}
  .bs-src{margin:8px 0 0;font-size:13px;color:var(--ts)}
  .bs-src a{text-decoration:underline}
  </style>
</head>
<body>
  <main class="bs-wrap">
    <h1 class="bs-title">2025 Yahoo 베스트 스토어</h1>
    <div id="bsRoot"></div>
  </main>
  <script src="bb-common.js"></script>
  <script src="bb-search-modal.js"></script>
  <script src="bb-track.js"></script>
  <script src="bb-best-store.js"></script>
</body>
</html>
