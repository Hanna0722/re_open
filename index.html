<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidBuy Renewal | 웹 미리보기</title>

<style>
:root{
  --rose:#E8385A;--rose-h:#C42F4C;--amber:#F5A623;
  --navy:#1A3C6E;--green:#3AAD4E;
  --bg:#F5F7FA;--border:#E0E4EB;
  --tp:#1A1A2E;--ts:#666680;--tm:#999BAA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{font-family:Pretendard,'Apple SD Gothic Neo','Helvetica Neue','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;color:var(--tp);font-size:14px;line-height:1.5;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── 공지 바 (web_main 동일) ── */
.notice-bar{background:#F1F3F5;color:#111;text-align:center;font-size:13px;padding:9px 16px;font-weight:500;flex-shrink:0}
.notice-bar b{color:var(--rose)}

/* ── GNB 헤더 (web_main 동일) ── */
header{background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hdr{max-width:100%;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px}
.hb-btn{display:flex;flex-direction:column;gap:4.5px;padding:8px;border-radius:7px;cursor:pointer;background:none;border:none;flex-shrink:0;transition:background .15s}
.hb-btn:hover{background:var(--bg)}
.hb-btn span{display:block;width:17px;height:2px;background:var(--tp);border-radius:1px}
.logo{display:flex;align-items:center;flex-shrink:0}
.logo img{display:block;width:100px;height:auto}
.search{flex:0 0 460px;max-width:460px;display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s}
.search:focus-within{border-color:var(--rose)}
.search input{flex:1;border:none;background:var(--bg);padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
.search input::placeholder{color:var(--tm)}
.search-btn{background:var(--rose);color:#fff;border:none;padding:0 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s}
.search-btn:hover{background:var(--rose-h)}
/* 프리뷰 유틸리티 (우측) */
.preview-utils{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.now-viewing{font-size:13px;color:var(--ts);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:6px 14px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-viewing b{color:var(--rose)}
.top-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:var(--ts);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none}
.top-btn:hover{border-color:var(--navy);color:var(--navy)}
.top-btn i{font-size:11px}

/* ── 채널 바 (web_main 동일) ── */
.channel-bar{background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.channel-inner{padding:0 20px;display:flex;align-items:center;gap:0}
.channel-icons{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.channel-icons::-webkit-scrollbar{display:none}
.ch-icon-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 12px;cursor:pointer;min-width:72px;flex-shrink:0;transition:opacity .15s;text-decoration:none}
.ch-icon-item:hover{opacity:.75}
.ch-circle{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ch-circle-logo{width:34px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ch-circle-logo .flag{font-size:13px;line-height:1}
.ch-circle-logo .brand{font-size:8px;font-weight:700;color:var(--tp);white-space:nowrap}
.ch-label{font-size:11px;color:var(--ts);font-weight:500;white-space:nowrap}

/* ── 레이아웃 ── */
.layout{flex:1;display:flex;min-height:0}

/* 좌측 페이지 목록 */
.nav{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:16px 0 24px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#D8DEE8;border-radius:3px}
.nav-group{padding:8px 16px 8px}
.nav-group-title{font-size:11px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;margin-bottom:6px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;user-select:none;transition:background .15s}
.nav-group-title:hover{background:var(--bg)}
.nav-group-title i{font-size:11px;color:var(--rose)}
.nav-group-title .chevron{margin-left:auto;font-size:10px;color:var(--tm);transition:transform .2s ease}
.nav-group-title.collapsed .chevron{transform:rotate(-90deg)}
.nav-group-items{overflow:hidden;transition:max-height .25s ease,opacity .2s ease;max-height:1000px;opacity:1}
.nav-group-items.collapsed{max-height:0;opacity:0}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ts);cursor:pointer;text-align:left;transition:all .12s;line-height:1.5}
.nav-item[hidden]{display:none}
.nav-item:hover{background:#FFF5F7;color:var(--rose)}
.nav-item.done{background:#EAF7EF;color:#247A3D;font-weight:700}
.nav-item.done .nav-file{color:#5E9E70}
.nav-item.done:hover{background:#DDF2E5;color:#1F6F37}
.nav-item.active{background:var(--rose);color:#fff;font-weight:700}
.nav-item.done.active{background:var(--green);color:#fff}
.nav-item.active .nav-file{color:rgba(255,255,255,.7)}
.nav-item i{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-file{display:block;font-size:11px;font-weight:400;color:var(--tm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}

/* 우측: 모니터 프레임 뷰어 */
.viewer{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#CDD1D9;padding:32px;overflow:auto}
.monitor-screen{width:100%;height:100%;max-width:1600px;flex:1;min-height:0;background:#fff;border-radius:12px;border:12px solid #1C2028;box-shadow:0 20px 50px rgba(20,24,32,.3);overflow:hidden;display:flex}
.monitor-screen iframe{flex:1;width:100%;border:none;background:#fff;display:block}
.monitor-neck{width:140px;height:40px;flex-shrink:0;background:linear-gradient(180deg,#2b3040,#1C2028);clip-path:polygon(38% 0,62% 0,78% 100%,22% 100%)}
.monitor-base{width:360px;max-width:70%;height:14px;flex-shrink:0;background:#1C2028;border-radius:8px;box-shadow:0 8px 16px rgba(0,0,0,.25)}

<script>
// ── 그룹 접기/펼치기 + localStorage 상태 유지 ──
var STORE_KEY = 'bb_web_nav_collapsed';

function loadCollapsed() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e) { return []; }
}
function saveCollapsed(arr) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch(e) {}
}

var collapsed = loadCollapsed();

document.querySelectorAll('.nav-group-title').forEach(function(title, idx) {
  var groupItems = title.nextElementSibling;
  // 저장된 상태 복원
  if (collapsed.indexOf(String(idx)) !== -1) {
    groupItems.classList.add('collapsed');
    title.classList.add('collapsed');
  }
  title.addEventListener('click', function() {
    var isCollapsed = groupItems.classList.toggle('collapsed');
    title.classList.toggle('collapsed', isCollapsed);
    var arr = loadCollapsed();
    var key = String(idx);
    if (isCollapsed) { if (arr.indexOf(key) === -1) arr.push(key); }
    else { arr = arr.filter(function(i) { return i !== key; }); }
    saveCollapsed(arr);
  });
});

var frame = document.getElementById('pageFrame');
var nowViewing = document.getElementById('nowViewing');
var openNewTab = document.getElementById('openNewTab');
var items = document.querySelectorAll('.nav-item');

function setActive(page, label) {
  items.forEach(function(it) {
    it.classList.toggle('active', it.getAttribute('data-page') === page);
  });
  if (nowViewing) nowViewing.innerHTML = '현재 페이지: <b>' + label + '</b>';
  if (openNewTab) openNewTab.href = page;
}

items.forEach(function(it) {
  it.addEventListener('click', function() {
    var page = it.getAttribute('data-page');
    frame.src = encodeURI(page);
    setActive(page, it.querySelector('.nav-item-label').childNodes[0].textContent);
  });
});

frame.addEventListener('load', function() {
  try {
    var file = decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
    var match = null;
    items.forEach(function(it) { if (it.getAttribute('data-page') === file) match = it; });
    if (match) {
      setActive(file, match.querySelector('.nav-item-label').childNodes[0].textContent);
    } else if (file) {
      if (nowViewing) nowViewing.innerHTML = '현재 페이지: <b>' + file + '</b>';
      if (openNewTab) openNewTab.href = file;
    }
  } catch(e) {}
});

function reloadFrame() { frame.src = frame.src; }

setActive('web_main.html', '메인');
</script>
