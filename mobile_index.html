<script>
// ── 그룹 접기/펼치기 + localStorage 상태 유지 ──
var STORE_KEY = 'bb_mobile_nav_collapsed';

function loadCollapsed() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e) { return []; }
}
function saveCollapsed(arr) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch(e) {}
}

var collapsed = loadCollapsed();

document.querySelectorAll('.nav-group-title').forEach(function(title) {
  var idx = title.getAttribute('data-group');
  var items = title.nextElementSibling;
  // 저장된 상태 복원
  if (collapsed.indexOf(idx) !== -1) {
    items.classList.add('collapsed');
    title.classList.add('collapsed');
  }
  title.addEventListener('click', function() {
    var isCollapsed = items.classList.toggle('collapsed');
    title.classList.toggle('collapsed', isCollapsed);
    var arr = loadCollapsed();
    if (isCollapsed) { if (arr.indexOf(idx) === -1) arr.push(idx); }
    else { arr = arr.filter(function(i) { return i !== idx; }); }
    saveCollapsed(arr);
  });
});

// ── 페이지 네비게이션 ──
var frame = document.getElementById('pageFrame');
var nowViewing = document.getElementById('nowViewing');
var openNewTab = document.getElementById('openNewTab');
var navItems = document.querySelectorAll('.nav-item');

function setActive(page, label) {
  navItems.forEach(function(it) {
    it.classList.toggle('active', it.getAttribute('data-page') === page);
  });
  if (nowViewing) nowViewing.innerHTML = '<b>' + label + '</b>';
  if (openNewTab) openNewTab.href = page;
}

navItems.forEach(function(it) {
  it.addEventListener('click', function() {
    var page = it.getAttribute('data-page');
    frame.src = encodeURI(page);
    setActive(page, it.querySelector('.nav-item-label').childNodes[0].textContent);
  });
});

frame.addEventListener('load', function() {
  try {
    var file = decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
    var match = null;
    navItems.forEach(function(it) { if (it.getAttribute('data-page') === file) match = it; });
    if (match) {
      setActive(file, match.querySelector('.nav-item-label').childNodes[0].textContent);
    } else if (file) {
      if (nowViewing) nowViewing.innerHTML = '<b>' + file + '</b>';
      if (openNewTab) openNewTab.href = file;
    }
  } catch(e) {}
});

function reloadFrame() { frame.src = frame.src; }

setActive('mobile_main.html', '메인');
</script>
