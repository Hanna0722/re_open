<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>회원가입 - 가입완료 | BidBuy</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --rose:#E8385A; --rose-h:#C42F4C; --navy:#1A3C6E; --amber:#F5A623;
    --bg:#F5F6F8; --card:#fff; --border:#E0E4EB; --line:#EEEEEE;
    --tp:#1A1A2E; --ts:#666680; --tm:#999BAA;
  }
  html, body { width:100%; max-width:390px; margin:0 auto; background:#fff; overflow-x:hidden; }
  body { font-family:Pretendard,'Apple SD Gothic Neo','Helvetica Neue','Malgun Gothic','맑은 고딕',sans-serif; font-size:14px; color:var(--tp); line-height:1.5; padding-bottom:40px; }
  a { text-decoration:none; color:inherit; }
  button { font:inherit; cursor:pointer; }

  /* ── 헤더 ── */
  .m-header{ background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
  .m-header-top{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:1px; min-height:56px; }
  .m-brand-area{ display:flex; align-items:center; gap:10px; min-width:0; }
  .hb{ width:34px; height:34px; border-radius:5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:0; background:none; border:none; flex-shrink:0; }
  .hb span{ display:block; width:18px; height:2px; background:var(--tp); border-radius:999px; }
  .m-logo{ display:inline-flex; align-items:center; width:76px; line-height:0; }
  .m-logo img{ width:100%; height:auto; display:block; }
  .m-header-right{ display:flex; gap:4px; align-items:center; justify-self:end; }
  .m-login-btn{ min-width:62px; height:30px; background:var(--rose); color:#fff; border:none; padding:0 14px; border-radius:5px; font-size:11px; font-weight:700; font-family:inherit; }
  .m-icon-btn{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:none; background:none; color:var(--tp); font-size:16px; border-radius:5px; position:relative; }
  .m-icon-btn .badge{ position:absolute; top:3px; right:2px; background:var(--rose); color:#fff; font-size:7px; font-weight:700; min-width:13px; height:13px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0 2px; }
  .m-user-avatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--rose),#F5A623); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; border:none; font-family:inherit; }

  /* ── 스텝 히어로 ── */
  .join-hero{ position:relative; overflow:hidden; margin:12px 12px 0; padding:20px 16px 22px; border-radius:10px; background:#F6F7F9; text-align:center; }
  .join-hero::after{ content:""; position:absolute; right:-70px; bottom:-110px; width:260px; height:260px; border-radius:50%; background:#EDEFF2; }
  .join-hero-sub{ position:relative; z-index:1; font-size:11px; font-weight:600; color:var(--ts); }
  .join-hero-title{ position:relative; z-index:1; margin:4px 0 16px; font-size:17px; font-weight:700; }
  .step-list{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:4px; }
  .step-item{ flex:1; min-width:0; padding:12px 2px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; }
  .step-item.active{ border:2px solid var(--navy); }
  .step-num{ width:32px; height:32px; margin:0 auto 7px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-family:Roboto,sans-serif; font-size:13px; font-weight:800; line-height:1; }
  .step-name{ font-size:11px; font-weight:700; white-space:nowrap; }
  .step-arrow{ color:var(--tm); font-size:10px; flex-shrink:0; }

  /* ── 환영 카드 ── */
  .welcome-card{ margin:14px 12px 0; padding:26px 16px; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:url("etc%20icon/signup3_mobile.png") no-repeat top center/100% auto; }
  .welcome-card h1{ font-size:17px; font-weight:800; }
  .welcome-card p{ margin-top:8px; font-size:12px; color:var(--ts); }

  /* ── 가입 혜택 ── */
  .benefit-head{ margin:20px 0 12px; text-align:center; font-size:15px; font-weight:700; }
  .benefit-grid{ display:grid; gap:10px; margin:0 12px; }
  .benefit-card{ display:grid; grid-template-columns:72px minmax(0,1fr); align-items:stretch; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff; }
  .benefit-icon{ background-repeat:no-repeat; background-position:center; background-size:cover; }
  .benefit-icon.rose{ background-color:var(--rose); background-image:url("etc%20icon/benefit%20(2).png"); }
  .benefit-icon.navy{ background-color:var(--navy); background-image:url("etc%20icon/benefit%20(1).png"); }
  .benefit-body{ padding:16px 14px; text-align:center; }
  .benefit-name{ font-size:13px; font-weight:700; }
  .benefit-amount{ margin:5px 0 6px; font-family:'Roboto',sans-serif; font-size:18px; font-weight:800; color:var(--rose); }
  .benefit-amount.navy{ color:var(--navy); }
  .benefit-amount .won{ font-size:13px; }
  .benefit-amount .give{ margin-left:3px; font-size:12px; font-weight:600; color:var(--ts); font-family:inherit; }
  .benefit-desc{ font-size:12px; color:var(--tm); }

  /* ── 안내 박스 ── */
  .benefit-note{ display:flex; gap:10px; margin:14px 12px 0; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .benefit-note > i{ color:var(--tm); font-size:15px; flex:0 0 auto; margin-top:1px; }
  .benefit-note ul{ list-style:none; display:grid; gap:6px; }
  .benefit-note li{ position:relative; padding-left:11px; font-size:12px; color:var(--ts); line-height:1.6; }
  .benefit-note li::before{ content:"·"; position:absolute; left:3px; top:0; }

  /* ── CTA ── */
  .join-actions{ display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:8px; margin:22px 12px 0; }
  .btn{ height:46px; padding:0; border:1px solid transparent; border-radius:6px; font-size:13px; font-weight:700; font-family:inherit; }
  .btn-primary{ background:var(--rose); color:#fff; }
  .btn-line{ background:#fff; border-color:var(--border); color:var(--tp); }
</style>
</head>
<body>

<!-- 헤더 -->
<header class="m-header">
  <div class="m-header-top">
    <div class="m-brand-area">
      <button class="hb" type="button" aria-label="메뉴 열기" aria-expanded="false" onclick="openDrawer()"><span></span><span></span><span></span></button>
      <a class="m-logo" href="mobile_main.html" aria-label="BidBuy 홈"><img src="Bidbuy logo.png" alt="BidBuy Korea"></a>
    </div>
    <div class="m-header-right" id="m-guest-area">
      <button class="m-login-btn" type="button">로그인</button>
    </div>
    <div class="m-header-right" id="m-user-area" style="display:none">
      <button class="m-icon-btn" type="button" aria-label="알림"><i class="fa-regular fa-bell"></i><span class="badge">3</span></button>
      <button class="m-icon-btn" type="button" aria-label="장바구니"><i class="fa-solid fa-cart-shopping"></i><span class="badge">2</span></button>
      <button class="m-user-avatar" type="button" aria-label="회원 메뉴">한</button>
    </div>
  </div>
</header>

<!-- 스텝 히어로 -->
<section class="join-hero">
  <p class="join-hero-sub">글로벌쇼핑의 탁월한 경험!</p>
  <h1 class="join-hero-title">비드바이코리아 회원가입</h1>
  <div class="step-list">
    <div class="step-item">
      <div class="step-num">01</div>
      <div class="step-name">이용약관 동의</div>
    </div>
    <i class="fa-solid fa-chevron-right step-arrow" aria-hidden="true"></i>
    <div class="step-item">
      <div class="step-num">02</div>
      <div class="step-name">회원정보 입력</div>
    </div>
    <i class="fa-solid fa-chevron-right step-arrow" aria-hidden="true"></i>
    <div class="step-item active">
      <div class="step-num">03</div>
      <div class="step-name">회원가입완료</div>
    </div>
  </div>
</section>

<!-- 환영 카드 -->
<section class="welcome-card">
  <h1>비드바이 회원이 되신 것을 환영합니다</h1>
  <p>이제 해외 쇼핑과 경매를 더욱 간편하게 이용하실 수 있습니다.</p>
</section>

<!-- 가입 감사 혜택 -->
<h2 class="benefit-head">회원가입 감사 혜택</h2>
<section class="benefit-grid" aria-label="회원가입 감사 혜택">
  <div class="benefit-card">
    <div class="benefit-icon rose" aria-hidden="true"></div>
    <div class="benefit-body">
      <p class="benefit-name">가입 축하 마일리지</p>
      <p class="benefit-amount">5,000<span class="won">원</span><span class="give">지급</span></p>
      <p class="benefit-desc">발급일로부터 유효기간 1개월</p>
    </div>
  </div>
  <div class="benefit-card">
    <div class="benefit-icon navy" aria-hidden="true"></div>
    <div class="benefit-body">
      <p class="benefit-name">비바항공 국제운임 할인 쿠폰</p>
      <p class="benefit-amount navy">5,000<span class="won">원</span><span class="give">지급</span></p>
      <p class="benefit-desc">발급일로부터 유효기간 2개월</p>
    </div>
  </div>
</section>

<!-- 안내 -->
<div class="benefit-note">
  <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
  <ul>
    <li>마일리지는 1차 결제 시 구매수수료 할인에 사용 가능합니다.</li>
    <li>혜택은 마이페이지 또는 쿠폰함에서 확인할 수 있습니다.</li>
  </ul>
</div>

<!-- CTA -->
<div class="join-actions">
  <button class="btn btn-line" type="button" onclick="location.href='mobile_mypage.html'">마이페이지</button>
  <button class="btn btn-primary" type="button" onclick="startShopping()">쇼핑 시작하기</button>
  <button class="btn btn-line" type="button" onclick="location.href='mobile_mileage.html'">쿠폰함 보기</button>
</div>

<script>
function activateMobileHeaderUser() {
  document.getElementById('m-guest-area').style.display = 'none';
  document.getElementById('m-user-area').style.display = 'flex';
}
document.querySelectorAll('.m-login-btn').forEach(function (btn) {
  btn.addEventListener('click', activateMobileHeaderUser);
});

function startShopping() {
  try { localStorage.setItem('bb_logged_in', '1'); } catch (e) {}
  location.href = 'mobile_main.html';
}
</script>
<script src="bb-common-mobile.js"></script>
<script src="bb-search-modal-mobile.js"></script>
</body>
</html>
