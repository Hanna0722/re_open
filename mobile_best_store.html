<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 Yahoo 베스트 스토어 - BidBuy Korea</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  :root{--font-sans:'Pretendard','Malgun Gothic','돋움','Dotum','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',Arial,sans-serif;--tp:#1A1A2E;--ts:#666680;--rose-h:#C42F4C;--border:#E0E4EB;--bg:#F5F7FA}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0 auto;max-width:390px;min-width:320px;font-family:var(--font-sans);background:#fff;color:var(--tp);font-size:14px;line-height:1.5}
  a{text-decoration:none;color:inherit}
  .bs-wrap{padding:10px 16px 48px}
  .bs-title{margin:0 0 8px;font-size:22px;line-height:1.3;font-weight:700;text-align:center}
  .bs-sec{margin-bottom:24px}
  .bs-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .bs-rank{width:28px;flex:none;text-align:center;font-size:20px;font-weight:700;color:var(--tp)}
  .bs-top .bs-rank,.bs-cards .bs-rank{width:auto;min-width:36px}
  .bs-rank-1{color:var(--rose-h)}
  .bs-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .bs-tag{font-size:13px;font-weight:500;color:var(--ts)}
  .bs-name{font-size:15px;font-weight:700}
  .bs-desc{font-size:14px;color:var(--ts)}
  .bs-cat{margin-top:16px;scroll-margin-top:90px}
  .bs-h3{margin:0;padding-top:4px;font-size:14px;font-weight:700;color:var(--ts)}
  .bs-nav{margin:0 0 16px}
  .bs-tabs{display:flex;border-bottom:1px solid var(--border)}
  .bs-tab{flex:1;min-height:40px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--ts);cursor:pointer}
  .bs-tab.active{color:var(--tp);font-weight:700;border-bottom-color:var(--tp)}
  .bs-subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px;padding:8px 12px;background:var(--bg);border-radius:0 0 8px 8px}
  .bs-subnav::-webkit-scrollbar{display:none}
  .bs-subnav[hidden]{display:none}
  .bs-nav-link{flex:none;white-space:nowrap;min-height:36px;padding:0 14px;display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:5px;background:#fff;font-size:13px;color:var(--tp)}
  .bs-nav-link:hover{border-color:var(--tp)}
  .bs-cat-desc{margin:2px 0 4px;font-size:14px;color:var(--ts)}
  .bs-tabs{overflow-x:auto;scrollbar-width:none;justify-content:safe center}
  .bs-tabs::-webkit-scrollbar{display:none}
  .bs-tab{flex:none}
  [hidden]{display:none!important}
  .bs-main-tabs{display:flex;margin:0 0 3px;border-bottom:1px solid var(--border);position:sticky;top:var(--bs-sticky-top,0);z-index:20;background:#fff}
  .bs-main-tab{flex:1;min-height:48px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--ts);cursor:pointer}
  .bs-main-tab.active{color:var(--tp);font-weight:700;border-bottom-color:var(--tp)}
  .bs-intro{margin:0 0 8px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:14px;line-height:1.6;color:var(--ts);text-align:center}
  .bs-row{flex-wrap:wrap}
  .bs-prods{flex:0 0 100%;min-width:0;margin-top:4px;min-height:226px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
  .bs-prods::-webkit-scrollbar{display:none}
  .bs-prods .bs-prod{flex:0 0 132px;scroll-snap-align:start}
  .bs-prod{display:flex;flex-direction:column;gap:3px;padding:6px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--tp);min-width:0;text-align:left}
  .bs-prod-img{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
  .bs-prod-img img{width:100%;height:100%;object-fit:cover;display:block}
  .bs-prod-title{margin-top:4px;min-height:36px;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bs-prod-price{font-size:14px;color:var(--tp)}
  .bs-prod-cur{font-size:13px;color:var(--ts)}
  .bs-prod-buy{font-size:13px;color:var(--ts)}
  .bs-prod-meta{font-size:13px;font-weight:700;color:var(--tp)}
  a.bs-name{display:inline-flex;align-items:center;gap:6px;color:var(--tp);text-decoration:none}
  a.bs-name:hover{text-decoration:underline}
  .bs-name svg{flex:none;width:.6em;height:.6em}
  .bs-cat .bs-h3{padding-top:0;text-align:center;font-size:20px;line-height:1.3;color:var(--tp)}
  .bs-cat-desc{text-align:center;font-size:14px;line-height:1.5}
  .bs-sp .bs-cat{margin:0}
  .bs-sp .bs-cat-desc{padding:12px 14px;background:var(--bg);border-radius:8px}
  .bs-sp .bs-h3{padding-top:16px}
  .bs-sp .bs-cat:first-child .bs-h3{padding-top:8px}
  .bs-sp .bs-row{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 0 16px}
  .bs-sp .bs-info{flex:none;width:100%;align-items:center}
  .bs-sp .bs-name{font-size:24px;line-height:1.3}
  .bs-sp .bs-prods{flex:none;width:100%}
  .bs-more{display:none;width:100%;min-height:44px;margin-top:12px;border:1px solid var(--border);border-radius:22px;background:#fff;font:inherit;font-size:14px;color:var(--tp);cursor:pointer}
  .bs-src{margin:8px 0 0;font-size:13px;color:var(--ts)}
  .bs-src a{text-decoration:underline}
  .bs-rest{display:none}
  .bs-sec.open .bs-rest{display:block}
  .bs-more{display:block}
  .bs-sec.open .bs-more{display:none}
  </style>
</head>
<body>
  <header class="m-header"></header>
  <main class="bs-wrap">
    <h1 class="bs-title">2025 Yahoo 베스트 스토어</h1>
    <div id="bsRoot"></div>
  </main>
  <script src="bb-common-mobile.js"></script>
  <script src="bb-search-modal-mobile.js"></script>
  <script src="bb-track.js"></script>
  <script src="bb-best-store-mobile.js"></script>
</body>
</html>
