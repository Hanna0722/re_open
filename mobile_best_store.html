<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Yahoo 베스트 스토어 - BidBuy Korea</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  :root{--font-sans:'Pretendard','Malgun Gothic','돋움','Dotum','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',Arial,sans-serif;--tp:#1A1A2E;--ts:#666680;--rose-h:#C42F4C;--border:#E0E4EB;--bg:#F5F7FA}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0 auto;max-width:390px;min-width:320px;font-family:var(--font-sans);background:#fff;color:var(--tp);font-size:14px;line-height:1.5}
  a{text-decoration:none;color:inherit}
  .bs-wrap{padding:24px 16px 48px}
  .bs-title{margin:0 0 6px;font-size:22px;font-weight:700}
  .bs-sub{margin:0 0 24px;font-size:14px;color:var(--ts)}
  .bs-sec{margin-bottom:24px}
  .bs-h2{margin:0 0 4px;font-size:17px;font-weight:700}
  .bs-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .bs-rank{width:28px;flex:none;text-align:center;font-size:20px;font-weight:700;color:var(--tp)}
  .bs-rank-1{color:var(--rose-h)}
  .bs-thumb{width:72px;height:72px;flex:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .bs-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .bs-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .bs-tag{font-size:13px;font-weight:500;color:var(--ts)}
  .bs-name{font-size:15px;font-weight:700}
  .bs-desc{font-size:13px;color:var(--ts)}
  .bs-btn{width:100%;min-height:44px;justify-content:center;display:inline-flex;align-items:center;border:1px solid var(--tp);border-radius:8px;font-size:14px;font-weight:500;color:var(--tp);background:#fff}
  </style>
</head>
<body>
  <header class="m-header"></header>
  <main class="bs-wrap">
    <h1 class="bs-title">2026 Yahoo 베스트 스토어</h1>
    <p class="bs-sub">야후옥션이 선정한 신뢰 스토어입니다. 스토어를 누르면 해당 스토어의 상품 목록으로 이동합니다.</p>
    <div id="bsRoot"></div>
  </main>
  <script src="bb-common-mobile.js"></script>
  <script src="bb-search-modal-mobile.js"></script>
  <script src="bb-track.js"></script>
  <script src="bb-best-store-mobile.js"></script>
</body>
</html>
