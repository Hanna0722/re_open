<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidbuy 야후옥션</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --brand: #E8385A;
      --brand-dark: #f23c62;
      --text: #263447;
      --muted: #6f7785;
      --line: #d8dde6;
      --warm: #f3f1ed;
      --thumb: #d3e0ec;
      --page-w: 1140px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; min-width: 320px; background: #fff; color: var(--text);
      font-family:Pretendard,'Apple SD Gothic Neo','Helvetica Neue','Malgun Gothic','맑은 고딕',sans-serif;
      font-size:14px; line-height:1.5;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    /* ── Header ── */
    .top-notice-spacer { height: 34px; }

    .brand-area { display: flex; align-items: center; gap: 24px; min-width: 0; }

    .menu-button { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; display: grid; place-items: center; }

    .logo-link { width: 100px; display: block; line-height: 0; }
    .logo-link img { width: 100%; height: auto; display: block; }

    .global-search i, .icon-btn i { font-size: 18px; }

    .search-chip { height: 24px; padding: 0 10px; border: 0; border-radius: 3px; background: #f2f0ec; color: #111; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 900; white-space: nowrap; }
    .search-chip button { width: 14px; height: 14px; padding: 0; border: 0; background: transparent; color: #111; font-size: 13px; line-height: 1; }

    .icon-btn { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #6d7483; display: grid; place-items: center; }

    /* ── Main ── */
    main { width: min(calc(100vw - 24px), var(--page-w)); margin: 0 auto; padding: 18px 0 56px; }

    .sub-page-title { margin: 0 0 14px; padding-bottom: 13px; border-bottom: 1px solid #222; color: #0f253a; font-size: 24px; font-weight: 900; }

    /* URL bar */

    /* Result copy */
    .result-copy .red, .result-title .red { color: red; font-weight: 700; }

    /* ── Category panel ── */
    .category-panel { margin-bottom: 16px; border: 1px solid #d4dce8; background: #fff; }
    .category-grid { padding: 22px 28px 16px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 40px; }
    .category-group { display: grid; gap: 8px; align-content: start; }
    .category-group a { color: #0f253a; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }


    .category-more-wrap { display: none; }
    .all-category-button { width: 100%; height: 36px; padding: 0 14px; border: 1px solid #e8e8e8; border-radius: 4px; background: #f5f5f5; color: #111; font-size: 12px; font-weight: 600; text-align: right; }

    /* Category search bar */
    .category-search-bar { display: grid; grid-template-columns: 320px 420px 140px minmax(0, 1fr); align-items: center; height: 48px; margin: 0; border-top: 1px solid #d4dce8; background: #f7f7f7; overflow: hidden; }
    .category-store-label { display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding: 0 14px; color: #0f253a; font-size: 14px; font-weight: 800; white-space: nowrap; }
    .category-store-label i { color: #6f7785; font-size: 17px; flex: 0 0 auto; }
    .category-search-input { min-width: 0; height: 32px; padding: 0 14px; border: 1px solid #d4dce8; border-right: 0; background: #fff; color: var(--text); font-size: 14px; outline: 0; }
    .category-search-input::placeholder { color: #8b919d; }
    .category-search-button { width: 140px; height: 32px; border: 0; background: var(--brand); color: #fff; font-size: 14px; font-weight: 800; }

    /* ── Filter panel ── */
    .filter-panel { width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 0; background: #fff; display: grid; grid-template-columns: 94px minmax(220px, 1.4fr) minmax(150px, .8fr) minmax(190px, 1fr) minmax(140px, .75fr) 120px; align-items: end; gap: 14px; }
    .filter-title { align-self: center; margin: 0; color: #000; font-size: 18px; font-weight: 900; }
    .filter-block { margin: 0; min-width: 0; }
    .filter-block:last-of-type { margin: 0; }
    .filter-block-title { margin-bottom: 7px; color: #000; font-size: 13px; font-weight: 800; }
    .price-range-fields { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px; }
    .range-sep { color: #111; font-size: 13px; text-align: center; }
    .filter-text-input, .filter-select {
      width: 100%; height: 36px; padding: 0 11px; border: 1px solid #d9d9d9; border-radius: 5px;
      background: #fff; color: var(--text); font-size: 13px; outline: 0;
    }
    .filter-text-input::placeholder { color: #9aa3b2; }
    .filter-text-input:focus, .filter-select:focus { border-color: var(--brand); }
    /* 제목 줄에 체크박스를 함께 두어 필터 항목들이 같은 높이에 정렬되도록 한다 */
    .filter-block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .filter-block-head .filter-block-title { margin-bottom: 0; white-space: nowrap; }
    .filter-checkbox-row { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: #111827; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .filter-checkbox-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--brand); }
    .filter-submit { width: 100%; height: 36px; border: 0; border-radius: 5px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 900; }
    @media (max-width: 1100px) {
      .filter-panel { grid-template-columns: 94px repeat(2, minmax(220px, 1fr)); align-items: end; }
      .filter-submit { grid-column: 3; }
    }

    /* ── Best section (메인 모드) ── */
    .section-title { margin: 0 0 12px; color: #1d2636; font-size: 21px; font-weight: 700; }

    /* ── Result section (검색 모드) ── */
    .result-title-row { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(360px, 595px); align-items: center; gap: 24px; padding: 0 0 12px; border-bottom: 1px solid #111; }
    .result-title-wrap { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .result-title { margin: 0; color: #111827; font-size: 17px; font-weight: 700; line-height: 1.25; word-break: keep-all; }
    .favorite-search { width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: #111; display: grid; place-items: center; }
    .favorite-search svg { width: 17px; height: 17px; stroke-width: 1.8; }
    .result-rescan { height: 34px; display: grid; grid-template-columns: minmax(0, 1fr) 124px; }
    .result-rescan input { min-width: 0; padding: 0 14px; border: 1px solid var(--line); border-right: 0; outline: 0; background: #fff; color: var(--text); font-size: 13px; }
    .result-rescan button { border: 0; background: var(--brand); color：#fff; font-size: 13px; font-weight: 700; }
    .result-control-row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .result-tabs { display: flex; align-items: center; gap: 32px; padding-left: 14px; }
    .result-tab { padding: 0; border: 0; background: transparent; color: #111; font-size: 12px; font-weight: 700; }
    .result-tab.active { color: var(--brand); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
    .filter-actions { display: flex; align-items: center; gap: 12px; }
    .sort-select { width: 112px; height: 30px; padding: 0 28px 0 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #1f497a; font-size: 12px; font-weight: 700; }
    .view-buttons { display: inline-flex; align-items: center; gap: 5px; }
    .view-button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); background: #fff; color: #a7adb7; display: grid; place-items: center; }
    .view-button.active { color: #1675cf; }
    .view-list, .view-grid { width: 14px; height: 14px; display: grid; gap: 2px; }
    .view-list { grid-template-rows: repeat(3, 1fr); }
    .view-grid { grid-template-columns: repeat(2, 1fr); }
    .view-list span, .view-grid span { display: block; background: currentColor; }

    /* ── Product grid ── */
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }
    .reveal-grid-wrap { position: relative; overflow: hidden; transition: max-height .28s ease; }
    .reveal-grid-wrap.is-collapsed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 76%); }
    .product-card { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; cursor: pointer; }
    .product-card:hover .product-name { text-decoration: underline; text-underline-offset: 2px; }
    .product-thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--thumb); overflow: hidden; }
    .product-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .thumb-actions { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .thumb-action,
    .heart { width: 34px; height: 34px; padding: 0; border: 1px solid #e0e3e8; border-radius: 50%; background: rgba(255,255,255,.96); color: #9aa1ad; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: none; transition: border-color .16s, background .16s, color .16s, transform .16s; }
    .thumb-action:hover,
    .heart:hover { border-color: #c9ced7; background: #fff; color: var(--brand); }
    .heart.active { background: var(--brand); color: #fff; transform: scale(1.04); }
    .site-badge { width: calc(100% - 24px); display: inline-flex; align-items: center; gap: 6px; margin: 10px 12px 0; padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; color: #333; font-size: 12px; font-weight: 700; }
    .site-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: 0 0 auto; }
    .site-flag-us { width: 16px; height: 12px; border-radius: 2px; flex: 0 0 auto; background: linear-gradient(#c9263b 0 12%, #fff 12% 24%, #c9263b 24% 36%, #fff 36% 48%, #c9263b 48% 60%, #fff 60% 72%, #c9263b 72% 84%, #fff 84%); }
    .site-flag-uk { width: 16px; height: 12px; border-radius: 2px; flex: 0 0 auto; background: linear-gradient(45deg, #153f8f 0 38%, #fff 38% 44%, #d6223b 44% 56%, #fff 56% 62%, #153f8f 62%); }
    .product-name { margin: 10px 14px 0; overflow: hidden; color: #1a1a1a; font-size: 14px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 41px; }
    .price-row { display: block; margin: 12px 14px 16px; }
    .price { color: #111; font-size: 17px; font-weight: 800; font-family: 'Roboto', sans-serif; }
    .auction-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; color: #7c8490; font-size: 12px; font-weight: 600; }
    .auction-meta > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bids { flex: 0 0 auto; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }

    /* More / footer */
    .more-row { position: relative; z-index: 2; height: 36px; margin-top: -18px; border: 1px dashed #d7d1cc; border-radius: 7px; background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: center; gap: 6px; color: #8d93a1; font-size: 12px; font-weight: 800; cursor: pointer; }
    .more-row::before { content: ""; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid currentColor; }
    .more-footer { padding: 30px 0; background: #fff; }
    .more-footer button { width: min(calc(100vw - 60px), var(--page-w)); height: 36px; margin: 0 auto; display: flex; border: 1px dashed #d7d1cc; border-radius: 5px; background: #111; color: #fff; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .more-footer button::before { content: ""; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #fff; }

    /* ── Content layout (sidebar + main area) ── */
    .content-layout { display: block; margin-top: 0; }
    .content-area { display: none !important; min-width: 0; }

    .content-layout .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }

    /* ── Responsive ── */

  </style>
</head>
<body>
  <div class="top-notice-spacer" aria-hidden="true"></div>

  <div class="store-strip">
    <nav class="store-list" aria-label="스토어 바로가기">
      <a class="store-chip active" href="#" data-store-name="야후 옥션" aria-current="page">
        <div class="store-badge"><img src="storeicon/store_yahoo_auction.png" alt=""></div><strong>야후 옥션</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="메루카리">
        <div class="store-badge"><img src="storeicon/store_mercari.png" alt=""></div><strong>메루카리</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="일본 라쿠텐">
        <div class="store-badge"><img src="storeicon/store_rakuten.png" alt=""></div><strong>일본 라쿠텐</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="일본 라쿠마">
        <div class="store-badge"><img src="storeicon/store_rakuma.png" alt=""></div><strong>일본 라쿠마</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="야후 쇼핑">
        <div class="store-badge"><img src="storeicon/store_yahoo_shopping.png" alt=""></div><strong>야후 쇼핑</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="야후 프리마">
        <div class="store-badge"><img src="storeicon/store_yahoo_furima.png" alt=""></div><strong>야후 프리마</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="미국 이베이">
        <div class="store-badge"><img src="storeicon/store_ebay_us.png" alt=""></div><strong>미국 이베이</strong>
      </a>
      <a class="store-chip" href="#" data-store-name="영국 이베이">
        <div class="store-badge"><img src="storeicon/store_ebay_uk.png" alt=""></div><strong>영국 이베이</strong>
      </a>
    </nav>
  </div>

  <main>
    <h1 class="sub-page-title" id="storePageTitle">야후옥션</h1>

    <!-- 카테고리 패널 -->
    <section class="category-panel" aria-label="카테고리 바로가기">
      <div class="category-grid">
        <div class="category-group">
          <a href="#">컴퓨터</a>
          <a href="#">장난감, 게임</a>
          <a href="#">취미, 문화</a>
          <a href="#">애완동물, 생물</a>
        </div>
        <div class="category-group">
          <a href="#">가전, AV, 카메라</a>
          <a href="#">스포츠, 레저</a>
          <a href="#">앤틱, 컬렉션</a>
          <a href="#">식품, 음료</a>
        </div>
        <div class="category-group">
          <a href="#">자동차, 오토바이</a>
          <a href="#">코믹, 애니메이션</a>
          <a href="#">뷰티, 건강 관리</a>
          <a href="#">꽃, 원예</a>
        </div>
        <div class="category-group">
          <a href="#">패션</a>
          <a href="#">책, 잡지</a>
          <a href="#">생활, 인테리어</a>
          <a href="#">티켓, 금권, 숙박예약</a>
        </div>
        <div class="category-group">
          <a href="#">액세서리, 시계</a>
          <a href="#">음악</a>
          <a href="#">탤런트 상품</a>
          <a href="#">자선</a>
        </div>
        <div class="category-group">
          <a href="#">유아용품</a>
          <a href="#">영화, 비디오</a>
          <a href="#">사무, 점포 용품</a>
          <a href="#">기타</a>
        </div>
      </div>
      <div class="category-more-wrap">
        <button class="all-category-button" type="button">전체 카테고리</button>
      </div>
      <form class="category-search-bar" data-category-search-form aria-label="카테고리 검색">
        <div class="category-store-label">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          <span data-category-store-name>야후 옥션</span>
        </div>
        <input class="category-search-input" type="search" name="q" placeholder="전체 카테고리에서 검색" data-category-search-input>
        <button class="category-search-button" type="submit">검색</button>
      </form>
    </section>

    <div class="content-layout">
      <section class="filter-panel" aria-label="검색 필터">
        <h2 class="filter-title">검색 필터</h2>

        <div class="filter-block">
          <div class="filter-block-title">가격 (JPY)</div>
          <div class="price-range-fields">
            <input type="text" class="filter-text-input" placeholder="최소 JPY" aria-label="최소 JPY">
            <span class="range-sep" aria-hidden="true">~</span>
            <input type="text" class="filter-text-input" placeholder="최대 JPY" aria-label="최대 JPY">
          </div>
        </div>

        <div class="filter-block">
          <div class="filter-block-title">상품상태</div>
          <select class="filter-select" aria-label="상품상태">
            <option>전체</option>
            <option>새 상품</option>
            <option>중고</option>
          </select>
        </div>

        <div class="filter-block">
          <div class="filter-block-head">
            <div class="filter-block-title">배송/판매</div>
            <label class="filter-checkbox-row"><input type="checkbox"><span>무료배송</span></label>
          </div>
          <select class="filter-select" aria-label="거래방식">
            <option>거래방식 전체</option>
            <option>경매</option>
            <option>즉시구매</option>
            <option>가격제안</option>
          </select>
        </div>

        <div class="filter-block">
          <div class="filter-block-title">판매자</div>
          <input type="text" class="filter-text-input" placeholder="판매자" aria-label="판매자">
        </div>

        <button class="filter-submit" type="button">적용</button>
      </section>

    <!-- 오른쪽: 컨텐츠 영역 -->
    <div class="content-area" hidden>
      <section data-view-main hidden aria-hidden="true"></section>
      <section data-view-search hidden aria-label="검색 결과"></section>
    </div><!-- /.content-area -->
    </div><!-- /.content-layout -->
  </main>

  <footer class="more-footer" data-more-footer hidden>
    <button type="button">펼쳐보기</button>
  </footer>

  <script>
    // ── DOM refs ──
    const keywordList       = document.querySelector("[data-keyword-list]");
    const globalSearch      = document.querySelector("[data-global-search]");
    const catSearchForm     = document.querySelector("[data-category-search-form]");
    const catSearchInput    = document.querySelector("[data-category-search-input]");
    const catStoreName      = document.querySelector("[data-category-store-name]");
    const storePageTitle    = document.getElementById("storePageTitle");
    const resultCopy        = document.querySelector("[data-result-copy]");
    const resultTitleEl     = document.querySelector("[data-result-title]");
    const resultRescan      = document.querySelector("[data-result-rescan]");
    const bestTitleEl       = document.getElementById("best-title");
    const viewMain          = document.querySelector("[data-view-main]");
    const viewSearch        = document.querySelector("[data-view-search]");
    const moreFooter        = document.querySelector("[data-more-footer]");

    // ── State ──
    let keywords = [];
    let mode = "main";

    function compactStoreLabel(value) {
      return String(value || "").replace(/\s+/g, "");
    }

    // ── Mode switching ──
    function switchToSearch() {
      mode = "search";
      viewMain.hidden = true;
      viewSearch.hidden = false;
      moreFooter.hidden = false;
      resultCopy.hidden = false;
      updateResultText();
    }

    function switchToMain() {
      mode = "main";
      viewMain.hidden = false;
      viewSearch.hidden = true;
      moreFooter.hidden = true;
      resultCopy.hidden = true;
      keywords = [];
      syncUrl();
      renderKeywords();
    }

    // ── Keywords ──
    function joined() { return keywords.join(" "); }

    function syncUrl() {
      const q = joined();
      window.history.replaceState(null, "", q ? `?q=${encodeURIComponent(q)}` : window.location.pathname);
    }

    function countNode() {
      const s = document.createElement("span");
      s.className = "red";
      s.textContent = "2,859";
      return s;
    }

    function updateResultText() {
      if (!keywords.length) {
        resultCopy.textContent = "검색어를 입력해 주세요.";
        resultTitleEl.replaceChildren("검색 결과 (전체 ", countNode(), "건)");
        catSearchInput.value = "";
        return;
      }
      const hl = document.createElement("span");
      hl.className = "red";
      hl.textContent = `'${joined()}'`;
      resultCopy.replaceChildren(hl, "에 대한 검색결과 입니다.");
      resultTitleEl.replaceChildren(`'${joined()}' 검색 결과 (전체 `, countNode(), "건)");
      catSearchInput.value = joined();
    }

    function renderKeywords() {
      keywordList.replaceChildren();
      keywords.forEach((kw, i) => {
        const chip = document.createElement("span");
        chip.className = "search-chip";
        chip.append(document.createTextNode(kw + " "));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("aria-label", kw + " 삭제");
        btn.dataset.keywordIndex = String(i);
        btn.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
        chip.append(btn);
        keywordList.append(chip);
      });
      if (mode === "search") updateResultText();
    }

    function addKeywords(value) {
      const next = value.trim().split(/\s+/).filter(Boolean);
      if (!next.length) return;
      keywords = next;
      syncUrl();
      renderKeywords();
      switchToSearch();
    }

    document.querySelectorAll(".category-group a").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const name = link.textContent.trim();
        const params = new URLSearchParams({ store: activeStore, category: name, path: name });
        location.href = "web_category_main.html?" + params.toString();
      });
    });

    // ── Store chips ──
    let activeStore = "야후 옥션";

    function updateSiteBadges() {
      const isUK = activeStore === "영국 이베이";
      const isEbay = isUK || activeStore === "미국 이베이";
      document.querySelectorAll("[data-site-badge]").forEach(badge => {
        badge.innerHTML = isEbay
          ? '<span class="' + (isUK ? "site-flag-uk" : "site-flag-us") + '" aria-hidden="true"></span>이베이'
          : '<span class="site-dot" aria-hidden="true"></span>야후';
      });
    }

    updateSiteBadges = function() {
      const raw = activeStore || "야후경매";
      const isUK = raw.includes("영국");
      const isEbay = raw.includes("이베이");
      const label = isEbay
        ? "이베이"
        : raw.includes("라쿠마")
          ? "라쿠마"
          : raw.includes("쇼핑")
            ? "야후 쇼핑"
            : "야후경매";
      document.querySelectorAll("[data-site-badge]").forEach(badge => {
        badge.innerHTML = isEbay
          ? '<span class="' + (isUK ? "site-flag-uk" : "site-flag-us") + '" aria-hidden="true"></span>' + label
          : '<span class="site-dot" aria-hidden="true"></span>' + label;
      });
    };

    document.querySelectorAll(".store-chip").forEach(chip => {
      chip.addEventListener("click", e => {
        e.preventDefault();
        document.querySelectorAll(".store-chip").forEach(c => { c.classList.remove("active"); c.removeAttribute("aria-current"); });
        chip.classList.add("active"); chip.setAttribute("aria-current", "page");
        const sn = chip.dataset.storeName || chip.querySelector("strong")?.textContent.trim();
        activeStore = sn || "야후 옥션";
        if (sn) {
          if (catStoreName) catStoreName.textContent = sn;
          if (storePageTitle) storePageTitle.textContent = compactStoreLabel(sn);
          if (bestTitleEl) bestTitleEl.textContent = chip.dataset.bestTitle || sn;
        }
        updateSiteBadges();
      });
    });

    // ── Result tabs ──
    document.querySelectorAll(".result-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".result-tab").forEach(t => {
          const on = t === tab;
          t.classList.toggle("active", on);
          t.setAttribute("aria-selected", String(on));
        });
      });
    });

    // ── View buttons ──
    const productStores = [
      { name: "야후경매", price: "¥ 2,500", auction: true },
      { name: "라쿠마", price: "¥ 1,800", auction: false },
      { name: "야후 쇼핑", price: "¥ 2,499", auction: false },
      { name: "이베이", price: "$ 21.79", auction: true, flag: "us" }
    ];
    const auctionCloseOffsets = [30, 120, 480, 1440, 2880];

    function formatRemainingTime(offsetMinutes) {
      if (offsetMinutes >= 1440) return Math.floor(offsetMinutes / 1440) + "일";
      if (offsetMinutes >= 60) return Math.floor(offsetMinutes / 60) + "시간";
      return Math.max(1, Math.round(offsetMinutes)) + "분";
    }

    function formatAuctionCloseTime(offsetMinutes) {
      const d = new Date(Date.now() + offsetMinutes * 60000);
      const pad = n => String(n).padStart(2, "0");
      const dateStr = d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate());
      const timeStr = pad(d.getHours()) + ":" + pad(d.getMinutes());
      return dateStr + " " + timeStr + " (" + formatRemainingTime(offsetMinutes) + ")";
    }

    function renderStoreBadge(badge, store) {
      const icon = store.flag === "us"
        ? '<span class="site-flag-us" aria-hidden="true"></span>'
        : '<span class="site-dot" aria-hidden="true"></span>';
      badge.innerHTML = icon + store.name;
    }

    function enhanceProductCards() {
      document.querySelectorAll(".product-card").forEach((card, index) => {
        const store = productStores[index % productStores.length];
        const badge = card.querySelector(".site-badge");
        if (badge) renderStoreBadge(badge, store);

        const price = card.querySelector(".price");
        if (price) price.textContent = store.price;

        const priceRow = card.querySelector(".price-row");
        if (priceRow && !priceRow.querySelector(".auction-meta")) {
          const meta = document.createElement("div");
          meta.className = "auction-meta";
          meta.innerHTML = store.auction
            ? '<span>' + formatAuctionCloseTime(auctionCloseOffsets[index % auctionCloseOffsets.length]) + '</span><span class="bids">(' + (((index * 13) % 99) + 1) + 'bids)</span>'
            : '<span></span><span></span>';
          priceRow.append(meta);
        }

        const thumb = card.querySelector(".product-thumb");
        const heart = card.querySelector(".heart");
        if (thumb && heart && !thumb.querySelector(".thumb-actions")) {
          const actions = document.createElement("div");
          actions.className = "thumb-actions";
          actions.innerHTML =
            '<button class="thumb-action" type="button" aria-label="상품 간편 보기" title="상품 간편 보기"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>' +
            '<button class="thumb-action" type="button" aria-label="새창으로 보기" title="새창으로 보기"><i class="fa-regular fa-window-restore" aria-hidden="true"></i></button>' +
            '<button class="thumb-action" type="button" aria-label="원문페이지보기" title="원문페이지보기"><i class="fa-solid fa-globe" aria-hidden="true"></i></button>';
          actions.append(heart);
          thumb.append(actions);

          const actionButtons = actions.querySelectorAll(".thumb-action");
          actionButtons[0].addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            window.openQuickView(window.collectQuickViewDataFromCard(card));
          });
          actionButtons[1].addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            window.open("web_auction.html", "_blank");
          });
          actionButtons[2].addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            window.open("https://auctions.yahoo.co.jp/", "_blank");
          });
        }

        if (heart && !heart.dataset.bound) {
          heart.dataset.bound = "true";
          heart.setAttribute("aria-pressed", "false");
          heart.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            const active = heart.classList.toggle("active");
            heart.setAttribute("aria-pressed", String(active));
            heart.innerHTML = '<i class="' + (active ? "fa-solid" : "fa-regular") + ' fa-heart" aria-hidden="true"></i>';
          });
        }
      });
    }

    enhanceProductCards();

    function ensureRevealItems(grid, targetCount) {
      const cards = Array.from(grid.querySelectorAll(".product-card"));
      if (!cards.length) return;
      for (let i = cards.length; i < targetCount; i += 1) {
        const clone = cards[i % cards.length].cloneNode(true);
        const thumb = clone.querySelector(".product-thumb");
        const actions = clone.querySelector(".thumb-actions");
        const heart = clone.querySelector(".heart");
        if (thumb && actions && heart) {
          thumb.append(heart);
          actions.remove();
        }
        if (heart) {
          delete heart.dataset.bound;
          heart.classList.remove("active");
          heart.setAttribute("aria-pressed", "false");
          heart.innerHTML = '<i class="fa-regular fa-heart" aria-hidden="true"></i>';
        }
        const img = clone.querySelector(".product-thumb img");
        if (img) img.src = img.src.replace(/lock=\d+/, "lock=" + (100 + i));
        grid.append(clone);
      }
      enhanceProductCards();
    }

    function setupRevealGrid(grid, trigger, options = {}) {
      if (!grid || !trigger || grid.dataset.revealReady) return;
      grid.dataset.revealReady = "true";
      ensureRevealItems(grid, options.targetCount || 24);

      const wrap = document.createElement("div");
      wrap.className = "reveal-grid-wrap";
      grid.parentNode.insertBefore(wrap, grid);
      wrap.append(grid);

      const rowsPerStep = options.rowsPerStep || 2;
      let visibleRows = options.initialRows || 2;

      function getColumnCount() {
        const columns = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean);
        return Math.max(1, columns.length);
      }

      function applyHeight() {
        const cards = Array.from(grid.querySelectorAll(".product-card"));
        const columns = getColumnCount();
        const totalRows = Math.ceil(cards.length / columns);
        const first = cards[0];
        if (!first) return;
        const rowGap = parseFloat(getComputedStyle(grid).rowGap) || 0;
        const rowHeight = first.getBoundingClientRect().height;
        const fullHeight = (rowHeight * visibleRows) + (rowGap * Math.max(0, visibleRows - 1));
        const hasMore = visibleRows < totalRows;
        wrap.style.maxHeight = hasMore ? (fullHeight + Math.min(92, rowHeight * .45)) + "px" : "none";
        wrap.classList.toggle("is-collapsed", hasMore);
        trigger.hidden = !hasMore;
      }

      trigger.addEventListener("click", () => {
        visibleRows += rowsPerStep;
        applyHeight();
      });

      window.addEventListener("resize", applyHeight);
      requestAnimationFrame(applyHeight);
    }

    setupRevealGrid(document.querySelector("[data-view-main] .product-grid"), document.querySelector("[data-view-main] .more-row"));

    document.querySelectorAll(".view-button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".view-button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // ── Product card navigation ──
    document.querySelectorAll("[data-view-main] .product-card").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest("button, a")) return;
        if (activeStore === "메루카리") {
          window.location.href = "web_purchase merukari.html";
        } else {
          window.location.href = "web_auction.html";
        }
      });
    });

    document.querySelectorAll("[data-view-search] .product-card").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest("button, a")) return;
        window.location.href = "web_bill_1st.html";
      });
    });

    // ── Keyword chip removal ──
    keywordList.addEventListener("click", e => {
      const btn = e.target.closest("[data-keyword-index]");
      if (!btn) return;
      keywords.splice(Number(btn.dataset.keywordIndex), 1);
      syncUrl(); renderKeywords();
      if (!keywords.length) switchToMain();
    });

    // ── Form submissions ──
    globalSearch.addEventListener("submit", e => {
      e.preventDefault();
      const inp = globalSearch.querySelector("input");
      addKeywords(inp.value); inp.value = "";
    });

    catSearchForm.addEventListener("submit", e => {
      e.preventDefault();
      const q = catSearchInput.value.trim();
      if (q) addKeywords(q);
    });

    resultRescan.addEventListener("submit", e => {
      e.preventDefault();
      const inp = resultRescan.querySelector("input");
      addKeywords(joined() + " " + inp.value); inp.value = "";
    });

    // ── Init ──
    const initialQuery = new URLSearchParams(window.location.search).get("q") || "";
    if (initialQuery.trim()) {
      keywords = initialQuery.trim().split(/\s+/).filter(Boolean);
      renderKeywords();
      switchToSearch();
    }
  </script>
<script src="bb-common.js"></script>
<script src="bb-search-modal.js"></script>
<script src="bb-quickview.js"></script>
</body>
</html>
